<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" width="100%" height="100%">
  <!-- Exact 1:1 Vector Remaster of the 1992 Amba Enterprises Heritage Identity -->
  <g id="heritageEmblem" transform="translate(4, 16)">
    <!-- Upper Rising Flow Bar -->
    <path 
      d="M 2 22 L 52 22 L 76 2 L 87 2 L 60 29 L 2 29 Z" 
      fill="#0528B8" 
    />
    <!-- Lower Rising Flow Bar -->
    <path 
      d="M 2 37 L 52 37 L 76 17 L 87 17 L 60 44 L 2 44 Z" 
      fill="#0528B8" 
    />
  </g>

  <!-- Typography: Faithful Serif Heritage Wordmark -->
  <g transform="translate(104, 45)">
    <!-- Amba Enterprises -->
    <text 
      x="0" 
      y="0" 
      font-family="'Playfair Display', 'Times New Roman', 'Garamond', Georgia, serif" 
      font-size="36" 
      font-weight="700" 
      fill="#0528B8" 
      letter-spacing="-0.01em"
    >Amba Enterprises</text>

    <!-- Subtitle: Exact Original Tagline -->
    <text 
      x="4" 
      y="21" 
      font-family="'Times New Roman', 'Garamond', Georgia, serif" 
      font-style="italic" 
      font-size="12" 
      font-weight="500" 
      fill="#0528B8" 
      letter-spacing="0.02em"
    >A renowned name in the field of Energies &amp; Utilities</text>
  </g>
</svg>
