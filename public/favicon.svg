<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6E40" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>
    <linearGradient id="favNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#1E2B63" />
    </linearGradient>
  </defs>

  <!-- Industrial Rounded Square Badge -->
  <rect width="64" height="64" rx="14" fill="url(#favNavy)" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- The Amba Dual Rising Energy Streams -->
  <g transform="translate(1, 0)">
    <!-- Upper Stream (Combustion Flame) -->
    <path 
      d="M 11 31 L 33 31 L 44 14 L 52 14 L 38 37 L 11 37 Z" 
      fill="url(#favFlame)" 
    />
    <!-- Lower Stream (High-Grade Engineering Steel) -->
    <path 
      d="M 11 43 L 33 43 L 44 26 L 52 26 L 38 49 L 11 49 Z" 
      fill="#F1F5F9" 
    />
  </g>
</svg>